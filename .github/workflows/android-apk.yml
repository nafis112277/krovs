name: Build Android APK

# Builds an installable debug APK of the Capacitor Android shell.
# Run it manually: GitHub repo -> Actions -> "Build Android APK" -> Run workflow.
# It also runs automatically when the Android/Capacitor files change on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-webroot/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (Capacitor 8 CLI needs Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up JDK 21 (Capacitor 8 compiles with Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # bun.lock exported from Lovable pins every package to Lovable's private
      # registry (europe-west*-npm.pkg.dev), which GitHub runners cannot reach.
      # Same packages and versions exist on the public npm registry, so point the
      # lockfile there for this build only (the file in the repo is not changed).
      - name: Point bun.lock at the public npm registry
        run: sed -i -E 's#https://europe-west[0-9]+-npm\.pkg\.dev/lovable-core-prod/[^/]+/#https://registry.npmjs.org/#g' bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The app loads the hosted site (server.url in capacitor.config.ts), so no
      # web build is needed. Sync copies the config + plugins into android/.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: food-fashion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
