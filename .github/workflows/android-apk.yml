name: Build Android APK

# Place this file at the REPO ROOT: .github/workflows/android-apk.yml
# GitHub only runs workflows from there, never from a sub-folder.
# The Capacitor project lives in a sub-folder (APP_DIR below).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pop-up-fixer-apk-min/pop-up-fixer-apk-min/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: pop-up-fixer-apk-min/pop-up-fixer-apk-min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (Capacitor 8 CLI needs Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up JDK 21 (Capacitor 8 compiles with Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The app loads the hosted site (server.url in capacitor.config.ts), so no
      # web build is needed. Sync copies the config + plugins into android/.
      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: food-fashion-debug-apk
          path: pop-up-fixer-apk-min/pop-up-fixer-apk-min/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
